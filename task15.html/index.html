<html>
<head>
    <title>Explore the World – Travel Agency</title>
</head>
<frameset rows="20%, 65%, 15%" frameborder="1">
    
    <!-- Top Frame: Header -->
    <frame src="header.html" name="header_frame" scrolling="no" noresize marginwidth="10" marginheight="10">
    
    <!-- Middle Frame: Divided vertically into 3 columns -->
    <frameset cols="25%, 45%, 30%">
        <frame src="navigation.html" name="nav_frame" scrolling="auto" noresize>
        <!-- The middle column defaults to destinations, but can also load home -->
        <frame src="destinations.html" name="dest_frame" scrolling="yes">
        <frame src="packages.html" name="pack_frame" scrolling="yes">
    </frameset>
    
    <!-- Bottom Frame: Footer -->
    <frame src="footer.html" name="footer_frame" scrolling="no" noresize marginwidth="5" marginheight="5">

</frameset>
</html>
